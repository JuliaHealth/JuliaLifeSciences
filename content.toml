# JuliaLifeSciences content
# Edit this file to update the site. Each capability's `packages` list controls
# its carousel; matching `[[packages]]` blocks provide the card content.
# `paper` and `tutorial` are optional package fields.

[site]
logo = "/JuliaBHFlogo.svg"
meta_title = "JuliaLifeSciences — One language. Every scale of life."
meta_description = "Discover Julia packages for bioinformatics, biology, health, medicine, imaging, and ecology."
eyebrow = "Explore the Julia life sciences ecosystem"
title = "One language. Every scale of"
accent = "life."
intro = "From DNA and proteins to populations and medical images, discover open-source Julia tools built for ambitious life-science research."
primary_cta = "Explore packages"
secondary_cta = "Meet the communities"
scroll_cue = "Scroll to explore"
topics = ["DNA & RNA", "Proteins", "Medical imaging", "Health", "Ecology"]
proofs = ["Open source", "Composable", "Fast", "Reproducible"]
footer_note = "A community showcase for the tools, people, and possibilities shaping life-science research in Julia."

[sections]
capabilities_kicker = "What can you do? · Hand-curated packages"
capabilities_title = "From raw data to discovery."
capabilities_intro = "Explore a focused selection of Julia packages, hand-curated for relevance, practical value, and community adoption across life-science workflows."
organizations_kicker = "The ecosystem"
organizations_title = "Three communities. One shared purpose."
organizations_intro = "Open communities building the foundations for modern biological, health, and ecological research."
testimonials_kicker = "Community stories"
testimonials_title = "Research moves faster in Julia."
testimonials_intro = "The entries below are editable examples. Replace each quote, name, role, and organization with a real community story."

[[organizations]]
id = "biojulia"
name = "BioJulia"
focus = "Molecular biology"
description = "Core tools for biological sequences, structures, genomes, and bioinformatics workflows."
url = "https://biojulia.dev"
logo = "https://github.com/BioJulia.png?size=160"
color = "#2d8c5f"

[[organizations]]
id = "juliahealth"
name = "JuliaHealth"
focus = "Health & medicine"
description = "Open software for medical imaging, clinical data, physiology, and computational medicine."
url = "https://juliahealth.org"
logo = "https://github.com/JuliaHealth.png?size=160"
color = "#c94b47"

[[organizations]]
id = "ecojulia"
name = "EcoJulia"
focus = "Ecology & evolution"
description = "High-performance tools for biodiversity, ecosystems, phylogenetics, and spatial ecology."
url = "https://github.com/EcoJulia"
logo = "https://github.com/EcoJulia.png?size=160"
color = "#7857a7"

[[capabilities]]
number = "01"
title = "Data I/O"
description = "Read, write, and transform the formats that life-science research depends on."
packages = ["FASTX.jl", "DICOM.jl", "BioStructures.jl", "RasterDataSources.jl", "PubChemCrawler.jl"]

[[capabilities]]
number = "02"
title = "Simulation"
description = "Model complex biological and physical systems efficiently on CPUs and GPUs."
packages = ["KomaMRI.jl", "BloodFlowTrixi.jl", "Thunderbolt.jl", "EcoSISTEM.jl"]

[[capabilities]]
number = "03"
title = "Data analysis"
description = "Move from experimental data to reproducible statistical and computational insight."
packages = ["BioSequences.jl", "BioAlignments.jl", "Microbiome.jl", "NeuroAnalyzer.jl", "Diversity.jl"]

[[capabilities]]
number = "04"
title = "Visualization"
description = "Explore high-dimensional results with interactive, publication-ready visual tools."
packages = ["BioMakie.jl", "BioStructures.jl", "NeuroAnalyzer.jl", "Phylo.jl", "SpatialEcology.jl"]

[[capabilities]]
number = "05"
title = "Interoperability"
description = "Bring trusted libraries from other languages into a fast, composable Julia workflow."
packages = ["PythonCall.jl", "RCall.jl", "JuliaCall"]

# BioJulia — popular, active life-science packages first.
[[packages]]
name = "BioSequences.jl"
organization = "biojulia"
description = "Efficient data types and operations for DNA, RNA, and amino-acid sequences."
repo = "https://github.com/BioJulia/BioSequences.jl"
tutorial = "https://biojulia.dev/BioSequences.jl/stable/"
stars = 159
featured = true

[[packages]]
name = "BioStructures.jl"
organization = "biojulia"
description = "Read, write, analyze, and visualize macromolecular structures, especially proteins."
repo = "https://github.com/BioJulia/BioStructures.jl"
tutorial = "https://biojulia.github.io/BioStructures.jl/stable/"
paper = "https://doi.org/10.1093/bioinformatics/btaa502"
stars = 105

[[packages]]
name = "BioMakie.jl"
organization = "biojulia"
description = "Biology-focused plotting and interface tools built on the Makie visualization ecosystem."
repo = "https://github.com/BioJulia/BioMakie.jl"
stars = 70

[[packages]]
name = "GenomeGraphs.jl"
organization = "biojulia"
description = "A modern framework for representing and working with genomic graph data in Julia."
repo = "https://github.com/BioJulia/GenomeGraphs.jl"
stars = 70

[[packages]]
name = "FASTX.jl"
organization = "biojulia"
description = "Fast parsing and processing for FASTA and FASTQ biological sequence files."
repo = "https://github.com/BioJulia/FASTX.jl"
tutorial = "https://biojulia.dev/FASTX.jl/stable/"
stars = 66

[[packages]]
name = "BioAlignments.jl"
organization = "biojulia"
description = "Pairwise sequence alignment tools and common biological alignment operations."
repo = "https://github.com/BioJulia/BioAlignments.jl"
stars = 65

