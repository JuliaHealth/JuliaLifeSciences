# JuliaLifeSciences content
# Edit this file to update the site. Each package's `capabilities` list controls
# its filters and tags; values match the IDs in `[[capabilities]]` blocks.
# `paper` and `tutorial` are optional package fields.

[site]
logo = "/public/JuliaLifeSciencesLogo.svg"
meta_title = "JuliaLifeSciences — One language. Every scale of life."
meta_description = "Discover Julia packages for bioinformatics, biology, health, medicine, imaging, and ecology."
eyebrow = "Explore the Julia life sciences ecosystem"
title = "One language. Every scale of"
accent = "life."
intro = "From DNA and proteins to populations and medical images, discover open-source Julia tools built for ambitious life-science research."
primary_cta = "Explore packages"
secondary_cta = "Meet the communities"
scroll_cue = "Scroll to explore"
topics = ["DNA & RNA", "Proteins", "Medical imaging", "Health", "Ecology"]
proofs = ["Open source", "Composable", "Fast", "Reproducible"]
footer_note = "A community showcase for the tools, people, and possibilities shaping life-science research in Julia."
talks_nav = "JuliaCon talks"

[sections]
capabilities_kicker = "What can you do? · Hand-curated packages"
capabilities_title = "From raw data to discovery."
capabilities_intro = "Explore a focused selection of Julia packages, hand-curated for relevance, practical value, and community adoption across life-science workflows."
organizations_kicker = "The ecosystem"
organizations_title = "Three communities. One shared purpose."
organizations_intro = "Open communities building the foundations for modern biological, health, and ecological research."
testimonials_kicker = "Community stories"
testimonials_title = "Research moves faster in Julia."
testimonials_intro = "The entries below are editable examples. Replace each quote, name, role, and organization with a real community story."
talks_kicker = "From the JuliaCon archive"
talks_title = "Life sciences on stage."
talks_intro = "Watch researchers and community builders share the tools, applications, and ideas advancing biology, health, and ecology in Julia."

[[organizations]]
id = "biojulia"
name = "BioJulia"
focus = "Molecular biology"
description = "Core tools for biological sequences, structures, genomes, and bioinformatics workflows."
url = "https://biojulia.dev"
logo = "https://github.com/BioJulia.png?size=160"
color = "#2d8c5f"
slack_channels = ["#biology", "#sciml-sysbio"]

[[organizations]]
id = "juliahealth"
name = "JuliaHealth"
focus = "Health & medicine"
description = "Open software for medical imaging, clinical data, physiology, and computational medicine."
url = "https://juliahealth.org"
logo = "https://github.com/JuliaHealth.png?size=160"
color = "#c94b47"
slack_channels = ["#health-and-medicine"]

[[organizations]]
id = "ecojulia"
name = "EcoJulia"
focus = "Ecology & evolution"
description = "High-performance tools for biodiversity, ecosystems, phylogenetics, and spatial ecology."
url = "https://github.com/EcoJulia"
logo = "https://github.com/EcoJulia.png?size=160"
color = "#7857a7"

