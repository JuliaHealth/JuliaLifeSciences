# Interoperability — these packages keep their own repository organization
# metadata so the ecosystem section remains focused on the three communities.
[[packages]]
name = "PythonCall.jl"
organization = "juliapy"
capabilities = ["interoperability"]
organization_name = "JuliaPy"
organization_logo = "https://avatars.githubusercontent.com/u/22030672?v=4"
organization_color = "#4063d8"
description = "Call and share data with Python from Julia, with automatic conversion and CondaPkg integration."
repo = "https://github.com/JuliaPy/PythonCall.jl"
tutorial = "https://juliapy.github.io/PythonCall.jl/stable/"
stars = 1064
featured = true

[[packages]]
name = "RCall.jl"
organization = "juliainterop"
capabilities = ["interoperability"]
organization_name = "JuliaInterop"
organization_logo = "https://avatars.githubusercontent.com/u/20260648?v=4"
organization_color = "#9558b2"
description = "Call R from Julia and move values between both languages in the same workflow."
repo = "https://github.com/JuliaInterop/RCall.jl"
tutorial = "https://juliainterop.github.io/RCall.jl/stable/"
stars = 337

[[packages]]
name = "JuliaCall"
organization = "juliainterop"
capabilities = ["interoperability"]
organization_name = "JuliaInterop"
organization_logo = "https://avatars.githubusercontent.com/u/20260648?v=4"
organization_color = "#9558b2"
description = "Embed Julia in R and call Julia functions through a seamless R package interface."
repo = "https://github.com/JuliaInterop/JuliaCall"
tutorial = "https://juliainterop.github.io/JuliaCall/"
paper = "https://doi.org/10.21105/joss.01284"
stars = 287

